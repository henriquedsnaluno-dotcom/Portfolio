# Total de segundos
total_segundos = 3600


# Calculando horas, minutos e segundos
horas = total_segundos // 3600
resto_segundos = total_segundos % 3600
minutos = resto_segundos // 60
segundos = resto_segundos % 60


# Exibindo o resultado no formato H:MM:SS
print(f"{horas}:{minutos:02}:{segundos:02}")
